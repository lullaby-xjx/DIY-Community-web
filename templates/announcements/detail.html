{% extends 'base.html' %}
{% block title %}{{ item.title }}{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:760px">
    <div class="breadcrumb" style="margin-bottom:1rem">
      <a href="{% url 'home' %}">首页</a> &rsaquo; <a href="{% url 'announcement_list' %}">公告</a>
    </div>
    <div class="info-card">
      <h2 style="margin-bottom:.5rem">{{ item.title }}</h2>
      <div class="card-meta" style="padding-bottom:1rem;border-bottom:1px dashed var(--border)">
        <span><i class="bi bi-clock"></i> {{ item.create_time|date:"Y-m-d H:i" }}</span>
      </div>
      <div class="content-body" style="padding:1.2rem 0 0">{{ item.content|linebreaks }}</div>
    </div>
  </div>
</section>
{% endblock %}
